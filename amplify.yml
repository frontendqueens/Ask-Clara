version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e CLARA_AWS_REGION -e CLARA_AWS_ACCESS_KEY_ID -e CLARA_AWS_SECRET_ACCESS_KEY -e BEDROCK_MODEL_ID >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
